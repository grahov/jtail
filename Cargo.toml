[package]
name = "jtail"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Merged live tail of systemd journals across ssh hosts"
license = "MIT"
readme = "README.md"
keywords = ["systemd", "journald", "ssh", "logs", "tail"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
owo-colors = "4"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = true
strip = true
